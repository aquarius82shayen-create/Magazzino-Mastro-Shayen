<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<title>Mastro Shayen · Birra Magazzino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <img src="assets/header.png" class="header-art" alt="Mastro Shayen - Magazzino">
    <button id="settingsBtn" class="gear-btn" aria-label="Impostazioni">⚙</button>
  </header>

  <main id="app">
    <section id="dashboard" class="view active">
      <div class="filters">
        <div class="search-wrap">⌕<input id="inventorySearch" placeholder="Cerca materiale…" autocomplete="off"></div>
        <div class="custom-select" data-select="categoryFilter"><button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">Tutti i reparti <span>⌄</span></button><div class="custom-select-menu" role="listbox"></div><select id="categoryFilter" class="native-select" tabindex="-1" aria-hidden="true"><option value="">Tutti i reparti</option><option>Malti</option><option>Luppoli</option><option>Lieviti</option><option>Additivi</option></select></div>
      </div>

      <div id="inventoryList"></div>
    </section>

    <section id="creator" class="view">
      <div class="creator-head"><p class="eyebrow">CREATOR</p><h1>Il tuo assistente birraio</h1><p class="muted">Analizza il magazzino e suggerisce cosa puoi produrre e in quale quantità.</p></div>
      <button class="primary creator-analyze" id="creatorAnalyze">🍺 Analizza il magazzino</button>
      <div id="creatorResult" class="creator-results"></div>
      <form id="creatorQuestion" class="creator-chat-form"><input id="creatorInput" placeholder="Chiedi al Creator…" autocomplete="off"><button class="primary">Invia</button></form>
      <div id="creatorChat" class="creator-chat"></div>
    </section>

    <section id="recipes" class="view">
      <div class="page-head recipe-page-head">
        <div><p class="eyebrow">RICETTE</p><h1>Le mie ricette</h1></div>
        <div class="recipe-head-actions"><button type="button" class="secondary" id="recipeArchiveBtn">Archiviate</button><button type="button" class="primary" id="newRecipe">＋ Nuova ricetta</button></div>
      </div>
      <div id="recipeList" class="recipe-grid"></div>
    </section>

    <section id="settings" class="view">
      <div class="settings-head">
        <div><p class="eyebrow">IMPOSTAZIONI</p><h1>Dati dell'app</h1></div>
        <button class="secondary" id="closeSettings">Chiudi</button>
      </div>
      <div class="settings-card">
        <h2>Backup</h2>
        <p class="muted">Salva o ripristina magazzino e ricette.</p>
        <div class="button-row">
          <button class="secondary" id="backupBtn">💾 Salva backup</button>
          <label class="secondary file-btn">📂 Carica backup<input type="file" id="restoreFile" accept=".json"></label>
        </div>
      </div>
      <div class="settings-card danger-card">
        <h2>Reset reparto</h2>
        <p class="muted">Elimina tutti i lotti del reparto selezionato.</p>
        <div class="button-row">
          <button class="danger" data-reset="Malti">Malti</button>
          <button class="danger" data-reset="Luppoli">Luppoli</button>
          <button class="danger" data-reset="Lieviti">Lieviti</button>
          <button class="danger" data-reset="Additivi">Additivi</button>
        </div>
        <button class="danger full" id="resetAll">☢ Reset completo</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigazione">
    <button class="nav-btn active" data-view="dashboard"><span>⌂</span><b>Dashboard</b></button>
    <button class="nav-btn" data-view="recipes"><span>🍺</span><b>Ricette</b></button>
    <button class="nav-btn add-nav-btn" id="addProduct" type="button"><span>＋</span><b>Aggiungi</b></button>
    <button class="nav-btn" data-view="creator"><span>🤖</span><b>Creator</b></button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><button id="modalClose" class="modal-close">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
