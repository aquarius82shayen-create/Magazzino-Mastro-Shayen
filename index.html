<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-512.png">
<title>Mastro Shayen · Birra Magazzino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
  <img src="assets/logo.png" class="logo" alt="Mastro Shayen">
  <button id="searchBtn" class="icon-btn" aria-label="Cerca">⌕</button>
</header>

<aside id="drawer" class="drawer">
  <div class="drawer-head"><strong>MENU</strong><button id="closeMenu" class="icon-btn">×</button></div>
  <nav>
    <button data-view="dashboard">🏠 Dashboard</button>
    <button data-view="recipes">🍺 Ricette</button>
    <button data-view="settings">⚙️ Impostazioni</button>
  </nav>
</aside>
<div id="backdrop" class="backdrop"></div>

<main id="app">
  <section id="dashboard" class="view active">
    <div class="page-head">
      <div>
        <p class="eyebrow">DASHBOARD</p>
        <h1 id="inventoryTitle">Le tue scorte</h1>
        <p class="muted">Tutto il tuo magazzino in un colpo d'occhio.</p>
      </div>
      <button class="primary" id="addProduct2">＋ Aggiungi</button>
    </div>
    <div class="filters">
      <input id="inventorySearch" placeholder="Cerca materiale…">
      <select id="categoryFilter"><option value="">Tutti i reparti</option><option>Malti</option><option>Luppoli</option><option>Lieviti</option><option>Additivi</option></select>
    </div>
    <div id="inventoryList"></div>
  </section>

  <section id="recipes" class="view">
    <div class="page-head"><div><p class="eyebrow">RICETTE</p><h1>Le tue ricette</h1></div><button class="primary" id="newRecipe">＋ Ricetta</button></div>
    <div id="recipeList" class="recipe-grid"></div>
  </section>

  <section id="settings" class="view">
    <div class="page-head"><div><p class="eyebrow">DATI</p><h1>Impostazioni</h1></div></div>
    <div class="settings-card">
      <h2>Backup</h2><p class="muted">Salva o ripristina magazzino e ricette.</p>
      <div class="button-row"><button class="secondary" id="backupBtn">💾 Salva backup</button><label class="secondary file-btn">📂 Carica backup<input type="file" id="restoreFile" accept=".json"></label></div>
    </div>
    <div class="settings-card danger-card">
      <h2>Reset</h2><p class="muted">Il reset elimina i dati selezionati dal dispositivo.</p>
      <div class="button-row">
        <button class="danger" data-reset="Malti">Reset Malti</button><button class="danger" data-reset="Luppoli">Reset Luppoli</button>
        <button class="danger" data-reset="Lieviti">Reset Lieviti</button><button class="danger" data-reset="Additivi">Reset Additivi</button>
      </div>
      <button class="danger full" id="resetAll">☢️ Reset completo</button>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden"><div class="modal-box"><button id="modalClose" class="modal-close">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
